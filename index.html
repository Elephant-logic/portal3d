<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Portal World 3D</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; touch-action:none; }
body { background:#000; overflow:hidden; }
canvas { display:block; width:100vw; height:100vh; }
#worldname {
  position:fixed; top:16px; left:50%; transform:translateX(-50%);
  font-family:monospace; font-size:10px; letter-spacing:4px;
  color:rgba(200,160,255,0.7); pointer-events:none;
}
#xhair {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  width:14px; height:14px; pointer-events:none;
}
#xhair::before,#xhair::after {
  content:''; position:absolute; background:rgba(255,255,255,0.5); border-radius:1px;
}
#xhair::before { width:1px; height:100%; left:50%; transform:translateX(-50%); }
#xhair::after  { height:1px; width:100%; top:50%;  transform:translateY(-50%); }
#coords {
  position:fixed; bottom:76px; left:12px;
  font-family:monospace; font-size:9px; color:rgba(255,255,255,0.3);
  letter-spacing:1px; pointer-events:none;
}
#panel {
  position:fixed; right:0; top:0; bottom:0; width:210px;
  background:rgba(0,0,0,0.8); padding:14px 10px;
  font-family:monospace; font-size:9px; color:rgba(255,255,255,0.55);
  overflow-y:auto; display:none; letter-spacing:1px; border-left:1px solid rgba(255,255,255,0.08);
}
#panel.open { display:block; }
#panel h3 { font-size:8px; letter-spacing:3px; color:rgba(200,160,255,0.6); margin:10px 0 5px; }
.sr { display:flex; align-items:center; gap:5px; margin:3px 0; }
.sr label { width:72px; color:rgba(255,255,255,0.35); font-size:8px; }
.sr input  { flex:1; }
.pb {
  display:block; width:100%; padding:5px; margin:2px 0;
  background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.09);
  color:rgba(255,255,255,0.55); font-family:monospace; font-size:8px;
  letter-spacing:2px; cursor:pointer; border-radius:3px;
}
.pb:hover { background:rgba(255,255,255,0.1); }
#togglePanel {
  position:fixed; top:14px; right:14px;
  padding:7px 12px; background:rgba(0,0,0,0.5);
  border:1px solid rgba(255,255,255,0.12); border-radius:5px;
  color:rgba(255,255,255,0.5); font-family:monospace; font-size:9px;
  letter-spacing:2px; cursor:pointer;
}
#nav {
  position:fixed; bottom:0; left:0; right:0; height:68px;
  display:flex; justify-content:space-between; align-items:center;
  padding:0 8px 4px;
}
.nb {
  min-width:50px; height:50px; border-radius:8px;
  background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.1);
  color:rgba(255,255,255,0.6); font-family:monospace; font-size:8px;
  letter-spacing:1px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; user-select:none; -webkit-user-select:none;
}
.nb:active { background:rgba(255,255,255,0.15); }
.nc { display:flex; flex-direction:column; align-items:center; gap:3px; }
.nr { display:flex; gap:3px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="worldname">PORTAL WORLD</div>
<div id="xhair"></div>
<div id="coords"></div>
<button id="togglePanel" onclick="window._togglePanel()">SLIDERS</button>

<div id="panel">
  <h3>PORTAL</h3>
  <div class="sr"><label>FLOW</label>   <input type="range" id="sl_FLOW"       min="-0.3" max="0.3"  step="0.01" value="0.03"  oninput="window._sl('FLOW',+this.value)"></div>
  <div class="sr"><label>ENTROPY</label><input type="range" id="sl_TURB"       min="0"    max="1"    step="0.01" value="0"     oninput="window._sl('TURB',+this.value)"></div>
  <div class="sr"><label>DIFF</label>   <input type="range" id="sl_DIFF"       min="0"    max="1"    step="0.01" value="0.12"  oninput="window._sl('DIFF',+this.value)"></div>
  <div class="sr"><label>CURL</label>   <input type="range" id="sl_SPIN_AMT"   min="0"    max="1"    step="0.01" value="0.05"  oninput="window._sl('SPIN_AMT',+this.value)"></div>
  <div class="sr"><label>LOCK</label>   <input type="range" id="sl_LOCK_DEPTH" min="0"    max="1"    step="0.01" value="0"     oninput="window._sl('LOCK_DEPTH',+this.value)"></div>
  <div class="sr"><label>VORTEX</label> <input type="range" id="sl_PULL"       min="0"    max="1"    step="0.01" value="0"     oninput="window._sl('PULL',+this.value)"></div>
  <h3>WORLD</h3>
  <div class="sr"><label>HSCALE</label> <input type="range" id="sl_W_HSCALE"   min="0.3"  max="3"    step="0.05" value="1"     oninput="window._sl('W_HSCALE',+this.value)"></div>
  <div class="sr"><label>GRAVITY</label><input type="range" id="sl_W_GRAVITY"  min="0.1"  max="3"    step="0.05" value="1"     oninput="window._sl('W_GRAVITY',+this.value)"></div>
  <h3>PRESETS</h3>
  <button class="pb" onclick="window._preset('TERRAN')">TERRAN</button>
  <button class="pb" onclick="window._preset('VOLCANIC')">VOLCANIC</button>
  <button class="pb" onclick="window._preset('CRYSTAL')">CRYSTAL</button>
  <button class="pb" onclick="window._preset('DESERT')">DESERT</button>
  <button class="pb" onclick="window._preset('OCEAN')">OCEAN</button>
  <button class="pb" onclick="window._preset('ARCTIC')">ARCTIC</button>
  <button class="pb" onclick="window._preset('VORTEX')">VORTEX</button>
  <button class="pb" onclick="window._preset('PULSE')">PULSE</button>
</div>

<div id="nav">
  <div class="nr"><div class="nb" id="nb_ll">STR L</div></div>
  <div class="nc">
    <div class="nr"><div class="nb" id="nb_f">FWD</div></div>
    <div class="nr">
      <div class="nb" id="nb_l">◀</div>
      <div class="nb" id="nb_b">BACK</div>
      <div class="nb" id="nb_r">▶</div>
    </div>
    <div class="nr"><div class="nb" id="nb_j" style="background:rgba(80,180,100,0.12)">JUMP</div></div>
  </div>
  <div class="nr"><div class="nb" id="nb_lr">STR R</div></div>
</div>

<script type="module">
import { GL }               from './js/renderer/webgl.js';
import { Mesh }             from './js/renderer/mesh.js';
import { Camera }           from './js/renderer/camera.js';
import { Vec3 }             from './js/math/vec3.js';
import { PhysicsWorld }     from './js/physics/world.js';
import { TerrainChunk }     from './js/world/terrain.js';
import { SkyRenderer }      from './js/world/sky.js';
import { PlayerController } from './js/world/player.js';
import { TERRAIN_VERT, TERRAIN_FRAG } from './js/world/shaders.js';
import {
  setSliders, PRESETS, worldName,
  fbmTerrain, getSeaLevel
} from './js/world/vars.js';

// ── CANVAS & GL ──────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
function resize(){
  canvas.width  = canvas.clientWidth  * devicePixelRatio|0;
  canvas.height = canvas.clientHeight * devicePixelRatio|0;
}
resize();
window.addEventListener('resize', resize);

const gl      = new GL(canvas);
const camera  = new Camera();
const physics = new PhysicsWorld();
const terrain = new TerrainChunk(gl);
const sky     = new SkyRenderer(gl);
const player  = new PlayerController(physics);
const prog    = gl.createProgram(TERRAIN_VERT, TERRAIN_FRAG);

camera.fovY = Math.PI/2.5;
camera.near = 0.05;
camera.far  = 700;

player.spawnOnTerrain();

// ── INPUT ─────────────────────────────────────────────────────────────────
const keys  = {};
const inp   = { fwd:false,back:false,left:false,right:false,
                strafeL:false,strafeR:false,jump:false,sprint:false,
                lookDX:0,lookDY:0 };
let lookTid = null, lookLX=0, lookLY=0;

window.addEventListener('keydown', e=>{ keys[e.code]=true;
  if(e.code==='Tab'){e.preventDefault();window._togglePanel();}
});
window.addEventListener('keyup', e=>keys[e.code]=false);

canvas.addEventListener('touchstart', e=>{
  for(const t of e.changedTouches){
    if(t.clientY < canvas.clientHeight*0.72 && lookTid===null){
      lookTid=t.identifier; lookLX=t.clientX; lookLY=t.clientY;
    }
  }
  e.preventDefault();
},{passive:false});
canvas.addEventListener('touchmove', e=>{
  for(const t of e.changedTouches){
    if(t.identifier===lookTid){
      inp.lookDX+=t.clientX-lookLX; inp.lookDY+=t.clientY-lookLY;
      lookLX=t.clientX; lookLY=t.clientY;
    }
  }
  e.preventDefault();
},{passive:false});
canvas.addEventListener('touchend', e=>{
  for(const t of e.changedTouches)
    if(t.identifier===lookTid) lookTid=null;
});
canvas.addEventListener('click',()=>canvas.requestPointerLock());
document.addEventListener('mousemove', e=>{
  if(document.pointerLockElement===canvas){
    inp.lookDX+=e.movementX; inp.lookDY+=e.movementY;
  }
});

function navBtn(id,k){
  const el=document.getElementById(id);
  ['touchstart','mousedown'].forEach(ev=>el.addEventListener(ev,e=>{inp[k]=true;e.stopPropagation();},{passive:true}));
  ['touchend','mouseup','mouseleave'].forEach(ev=>el.addEventListener(ev,e=>{inp[k]=false;},{passive:true}));
}
navBtn('nb_f','fwd'); navBtn('nb_b','back');
navBtn('nb_l','left'); navBtn('nb_r','right');
navBtn('nb_ll','strafeL'); navBtn('nb_lr','strafeR');
navBtn('nb_j','jump');

function syncKeys(){
  inp.fwd    = inp.fwd    || keys['KeyW']||keys['ArrowUp'];
  inp.back   = inp.back   || keys['KeyS']||keys['ArrowDown'];
  inp.left   = inp.left   || keys['KeyA']||keys['ArrowLeft'];
  inp.right  = inp.right  || keys['KeyD']||keys['ArrowRight'];
  inp.strafeL= inp.strafeL|| keys['KeyQ'];
  inp.strafeR= inp.strafeR|| keys['KeyE'];
  inp.jump   = inp.jump   || keys['Space'];
  inp.sprint = keys['ShiftLeft'];
}

// ── SLIDER / PRESET API (called from HTML) ────────────────────────────────
let panelOpen=false;
window._togglePanel=()=>{
  panelOpen=!panelOpen;
  document.getElementById('panel').classList.toggle('open',panelOpen);
};
window._sl=(name,val)=>{
  setSliders({[name]:val});
  terrain._lastX=null; // force rebuild
};
window._preset=(name)=>{
  const p=PRESETS[name];
  if(!p) return;
  setSliders(p);
  for(const [k,v] of Object.entries(p)){
    const el=document.getElementById('sl_'+k);
    if(el) el.value=v;
  }
  terrain._lastX=null;
  player.spawnOnTerrain();
};

// ── MAIN LOOP ─────────────────────────────────────────────────────────────
let lastT=0;
function loop(ts){
  const dt=Math.min((ts-lastT)/1000, 0.05);
  lastT=ts;

  syncKeys();
  sky.update(dt);
  player.update(inp, dt);
  terrain.update(player.position.x, player.position.z, 0);

  // Camera
  camera.setPosition(player.getCameraPosition());
  camera.setOrientation(player.getCameraOrientation());
  camera.setAspect(canvas.width/canvas.height);
  camera.updateFrustum();

  // ── RENDER ───────────────────────────────────────────────────────────────
  const glc=gl.gl;
  glc.viewport(0,0,canvas.width,canvas.height);
  glc.clear(glc.COLOR_BUFFER_BIT|glc.DEPTH_BUFFER_BIT);

  // Sky
  sky.draw(camera);

  // Terrain + water
  glc.enable(glc.DEPTH_TEST);
  glc.depthFunc(glc.LEQUAL);
  glc.enable(glc.BLEND);
  glc.blendFunc(glc.SRC_ALPHA, glc.ONE_MINUS_SRC_ALPHA);
  glc.enable(glc.CULL_FACE);
  glc.cullFace(glc.BACK);

  prog.use();
  prog.setMat4('uView',      camera.viewMatrix);
  prog.setMat4('uProj',      camera.projMatrix);
  prog.setVec3('uCamPos',    camera.position);
  prog.setVec3('uSunDir',    sky.getSunDir());
  prog.setVec3('uSunColour', new Vec3(1.0,0.95,0.85));
  prog.setFloat('uSunIntensity', sky.daylight*1.3);
  prog.setVec3('uAmbient',   new Vec3(0.08,0.10,0.15));
  prog.setFloat('uFogDensity', 0.000055);
  prog.setVec3('uFogColour', sky.getFogColour());

  terrain.draw();

  // HUD update
  const SEA=getSeaLevel();
  const h=fbmTerrain(player.position.x, player.position.z, 0);
  document.getElementById('coords').textContent=
    `X:${Math.round(player.position.x)}  Z:${Math.round(player.position.z)}  `+
    `H:${(h-SEA).toFixed(1)}${player.inWater?' ~WATER~':''}`;
  document.getElementById('worldname').textContent=worldName();

  // Clear per-frame input
  inp.lookDX=0; inp.lookDY=0;
  inp.jump=false;

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
